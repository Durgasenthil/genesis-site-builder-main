<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Caduceus Medical Symbol -->
  <g transform="translate(250, 150)">
    <!-- Central staff -->
    <line x1="0" y1="-80" x2="0" y2="40" stroke="#B8860B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left wing -->
    <path d="M -5 -50 Q -60 -40 -85 -20" stroke="#B8860B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M -85 -20 Q -75 -35 -60 -50" stroke="#B8860B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M -85 -20 Q -75 -15 -60 -10" stroke="#B8860B" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Right wing -->
    <path d="M 5 -50 Q 60 -40 85 -20" stroke="#B8860B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 85 -20 Q 75 -35 60 -50" stroke="#B8860B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 85 -20 Q 75 -15 60 -10" stroke="#B8860B" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Left serpent coil -->
    <path d="M -15 -10 Q -25 0 -20 15 Q -10 20 0 15 Q 5 12 8 8" stroke="#B8860B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-20" cy="15" r="3" fill="#B8860B"/>
    
    <!-- Right serpent coil -->
    <path d="M 15 -10 Q 25 0 20 15 Q 10 20 0 15 Q -5 12 -8 8" stroke="#B8860B" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="15" r="3" fill="#B8860B"/>
    
    <!-- Top circle/crown -->
    <circle cx="0" cy="-85" r="8" stroke="#B8860B" stroke-width="2" fill="none"/>
    <circle cx="0" cy="-85" r="4" fill="#B8860B"/>
  </g>
  
  <!-- Text -->
  <text x="250" y="280" font-family="serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#B8860B" letter-spacing="2">
    RAPHAEL
  </text>
  <text x="250" y="335" font-family="serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#B8860B" letter-spacing="1">
    HOMOEO CARE
  </text>
</svg>